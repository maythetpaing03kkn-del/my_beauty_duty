<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modern E-Commerce Store</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    /* Header & Navigation */
    header {
      position: sticky;
      top: 0;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      z-index: 100;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
    }

    .cart-btn {
      position: relative;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.25rem;
      padding: 0.5rem;
    }

    .cart-badge {
      position: absolute;
      top: 0;
      right: 0;
      background: var(--primary);
      color: white;
      font-size: 0.75rem;
      font-weight: bold;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Hero Section */
    .hero {
      background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
      padding: 4rem 2rem;
      text-align: center;
    }

    .hero h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .hero p {
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 auto 2rem;
    }

    /* Main Container & Products Grid */
    .main-container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 2rem;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 2rem;
    }

    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    .product-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background: #f1f5f9;
    }

    .product-info {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .product-price {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 1rem;
    }

    .add-btn {
      margin-top: auto;
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .add-btn:hover {
      background: var(--primary-hover);
    }

    /* Slide-out Cart Drawer */
    .cart-drawer {
      position: fixed;
      top: 0;
      right: -400px;
      width: 100%;
      max-width: 400px;
      height: 100%;
      background: var(--card-bg);
      box-shadow: -5px 0 25px rgba(0,0,0,0.15);
      z-index: 200;
      transition: right 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .cart-drawer.open {
      right: 0;
    }

    .cart-header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .cart-items {
      flex-grow: 1;
      overflow-y: auto;
      padding: 1.5rem;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .cart-footer {
      padding: 1.5rem;
      border-top: 1px solid var(--border);
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    .checkout-btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 1rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      display: none;
      z-index: 150;
    }

    .overlay.active {
      display: block;
    }
  </style>
</head>
<body>

  <!-- Header Navigation -->
  <header>
    <div class="nav-container">
      <a href="#" class="logo">StoreBrand</a>
      <button class="cart-btn" onclick="toggleCart()">
        🛒 <span class="cart-badge" id="cartBadge">0</span>
      </button>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <h1>Exclusive Collection</h1>
    <p>Discover our curated range of premium products designed for everyday style and performance.</p>
  </section>

  <!-- Product Catalog -->
  <main class="main-container">
    <div class="product-grid" id="productGrid"></div>
  </main>

  <!-- Overlay & Cart Drawer -->
  <div class="overlay" id="overlay" onclick="toggleCart()"></div>
  <aside class="cart-drawer" id="cartDrawer">
    <div class="cart-header">
      <h2>Your Cart</h2>
      <button class="close-btn" onclick="toggleCart()">&times;</button>
    </div>
    <div class="cart-items" id="cartItems">
      <p style="color: var(--text-muted);">Your cart is currently empty.</p>
    </div>
    <div class="cart-footer">
      <div class="cart-total">
        <span>Total:</span>
        <span id="cartTotal">$0.00</span>
      </div>
      <button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
    </div>
  </aside>

  <script>
    // Sample Products Data
    const products = [
      { id: 1, name: "Minimalist Watch", price: 120.00, image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500" },
      { id: 2, name: "Wireless Headphones", price: 85.00, image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500" },
      { id: 3, name: "Canvas Backpack", price: 65.00, image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500" },
      { id: 4, name: "Leather Sunglasses Case", price: 45.00, image: "https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=500" }
    ];

    let cart = [];

    // Render Products
    function renderProducts() {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = products.map(product => `
        <div class="product-card">
          <img src="${product.image}" alt="${product.name}" class="product-img" />
          <div class="product-info">
            <h3 class="product-title">${product.name}</h3>
            <p class="product-price">$${product.price.toFixed(2)}</p>
            <button class="add-btn" onclick="addToCart(${product.id})">Add to Cart</button>
          </div>
        </div>
      `).join('');
    }

    // Toggle Cart Drawer Visibility
    function toggleCart() {
      document.getElementById('cartDrawer').classList.toggle('open');
      document.getElementById('overlay').classList.toggle('active');
    }

    // Add Item to Cart
    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      const existing = cart.find(item => item.id === productId);

      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push({ ...product, quantity: 1 });
      }

      updateCartUI();
    }

    // Remove Item from Cart
    function removeFromCart(productId) {
      cart = cart.filter(item => item.id !== productId);
      updateCartUI();
    }

    // Update Cart UI, Badge, & Total
    function updateCartUI() {
      const cartItemsContainer = document.getElementById('cartItems');
      const cartBadge = document.getElementById('cartBadge');
      const cartTotal = document.getElementById('cartTotal');

      const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
      cartBadge.textContent = totalCount;

      if (cart.length === 0) {
        cartItemsContainer.innerHTML = '<p style="color: var(--text-muted);">Your cart is currently empty.</p>';
        cartTotal.textContent = '$0.00';
        return;
      }

      cartItemsContainer.innerHTML = cart.map(item => `
        <div class="cart-item">
          <div>
            <strong>${item.name}</strong>
            <p>$${item.price.toFixed(2)} × ${item.quantity}</p>
          </div>
          <button class="close-btn" style="color: red; font-size: 1rem;" onclick="removeFromCart(${item.id})">Remove</button>
        </div>
      `).join('');

      const grandTotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      cartTotal.textContent = `$${grandTotal.toFixed(2)}`;
    }

    function checkout() {
      if (cart.length === 0) {
        alert("Your cart is empty!");
        return;
      }
      alert("Proceeding to payment Gateway integration...");
    }

    // Initialize Page
    renderProducts();
  </script>
</body>
</html>
